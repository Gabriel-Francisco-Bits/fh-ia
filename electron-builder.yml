appId: do.bits.fhcode
productName: fh-code
executableName: fh-code
extraMetadata:
  main: fh-code/desktop/main.js
directories:
  output: fh-code/dist
files:
  - fh-code/**/*
  - out/**/*
  - package.json
  - "!fh-code/dist/**"
linux:
  executableArgs:
    - "--no-sandbox"
  target:
    - deb
    - AppImage
    - dir
  category: Development
  icon: fh-code/desktop/icon.png
  maintainer: gfh
  synopsis: Editor de codigo tipo Cursor con fh-ia
  description: Editor de escritorio Monaco con agente de IA integrado (Claude, Grok, OpenAI, FCC).
win:
  target:
    - nsis
    - portable
    - dir
  icon: fh-code/desktop/icon.png
mac:
  target:
    - dmg
    - zip
    - dir
  category: public.app-category.developer-tools
  icon: fh-code/desktop/icon.png
